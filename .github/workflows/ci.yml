name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # .gitignore keeps keystores out by accident; this catches a forced add.
      - name: Refuse tracked keystores and keys
        run: |
          tracked=$(git ls-files -- '*.jks' '*.keystore' '*.p12' '*.pem')
          if [ -n "$tracked" ]; then
            echo "::error::Keystore or key files must never be committed: $tracked"
            exit 1
          fi
      - name: Release consistency (scripts and current version)
        run: |
          scripts/check-release.test.sh
          scripts/check-release.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      # Robolectric downloads a ~240 MB android-all jar for SDK 37 on first use.
      - uses: actions/cache@v6
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-4.17-sdk37
      - name: Build (debug + release), lint, unit tests, offline guardrail
        run: ./gradlew assembleDebug assembleRelease lintDebug testDebugUnitTest verifyNoNetworkPermission
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports
